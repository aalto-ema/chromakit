name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'packaging/windows/**'
      - 'src/chromakit/**'
      - 'examples/synthetic_uv.csv'
      - 'pyproject.toml'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  installer:
    name: Build and verify x64 installer
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install application and packaging dependencies
        run: python -m pip install . -r packaging/windows/requirements.txt
      - name: Build Windows setup executable
        run: ./packaging/windows/build.ps1
      - name: Install, launch and uninstall
        run: ./packaging/windows/smoke-test.ps1
      - name: Upload verified installer and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ChromaKit-Windows-x64
          path: |
            dist/windows-installer/*.exe
            dist/windows-installer/*.sha256
            dist/windows-installer/build-info.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload installer test logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-installer-diagnostics
          path: dist/windows-smoke/*.log
          if-no-files-found: ignore
          retention-days: 7
